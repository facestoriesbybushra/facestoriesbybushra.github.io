<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Received Successfully - Face Stories by Bushra</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Success Page Styles */
.success-container {
    max-width: 1200px;
    margin: 100px auto;
    padding: 0 20px;
    min-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.success-card {
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    text-align: center;
    transform: translateY(20px);
    opacity: 0;
    transition: all 0.6s ease;
    max-width: 600px;
    width: 100%;
}

.success-icon {
    color: #ff6b6b; /* Your brand pink color */
    font-size: 4rem;
    margin-bottom: 20px;
    animation: bounce 1s ease;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.success-card h1 {
    color: #333;
    margin-bottom: 15px;
    font-size: 2.2rem;
}

.success-text {
    color: #666;
    font-size: 1.1rem;
    line-height: 1.6;
    margin-bottom: 30px;
}

.success-btn {
    background: #ff6b6b;
    color: white;
    border: none;
    padding: 15px 40px;
    border-radius: 30px;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
}

.success-btn:hover {
    background: #ff5252;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(255,107,107,0.3);
}

.additional-options {
    margin-top: 25px;
    color: #888;
}

.additional-options a {
    color: #ff6b6b;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.3s ease;
}

.additional-options a:hover {
    color: #ff5252;
}

@media (max-width: 768px) {
    .success-card {
        padding: 30px 20px;
        margin: 0 15px;
    }
    
    .success-card h1 {
        font-size: 1.8rem;
    }
    
    .success-text {
        font-size: 1rem;
    }
    
    .success-btn {
        padding: 12px 30px;
        font-size: 1rem;
    }
}
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-card">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h1>Message Received!</h1>
            <p class="success-text">
                Thank you for reaching out! I've received your message and will get back to you within 24-48 hours.
            </p>
            <button onclick="window.history.back()" class="success-btn">
                Return to Contact Page
            </button>
            <p class="additional-options">
                or go back to <a href="index.html">Homepage</a>
            </p>
        </div>
    </div>

    <!-- Footer (Matches your existing footer if any) -->
    <footer class="footer">
        <!-- Add your existing footer content here -->
    </footer>

    <script>
        // Optional: Add animation effects
        document.addEventListener('DOMContentLoaded', function() {
            const successCard = document.querySelector('.success-card');
            successCard.style.transform = 'translateY(0)';
            successCard.style.opacity = '1';
        });
    </script>
</body>
</html>
