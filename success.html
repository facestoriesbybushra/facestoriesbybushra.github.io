<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Received - Face Stories by Bushra</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Success Page Specific Styles */
        .success-wrapper {
            background: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-sizing: border-box;
            padding: 0; /* Remove any default padding */
            margin: 0; /* Remove any default margin */
        }

        .success-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
        }

        .success-card {
            background: #000000;
            border: 2px solid #D4AF37;
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            position: relative;
            overflow: hidden;
        }

        .success-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(212, 175, 55, 0.1), transparent);
            transform: rotate(45deg);
            z-index: 0;
        }

        .success-icon {
            color: #D4AF37;
            font-size: 4.5rem;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .success-card h1 {
            color: #D4AF37;
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .success-text {
            color: #ffffff;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            position: relative;
            z-index: 1;
        }

        .success-btn {
            background: #D4AF37;
            color: #000000;
            border: none;
            padding: 1rem 2.5rem;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid transparent;
            display: inline-block; /* Change to inline-block if using <a> tag */
            text-decoration: none; /* Remove underline */
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background: #000000; /* Match your black theme */
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000000;
            z-index: -1;
        }
        .success-btn:hover {
            background: #000000;
            color: #D4AF37;
            border-color: #D4AF37;
            transform: translateY(-2px);
        }

        .additional-options {
            margin-top: 2rem;
            color: #888;
            position: relative;
            z-index: 1;
        }

        .additional-options a {
            color: #D4AF37;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s ease;
        }

        .additional-options a:hover {
            opacity: 0.8;
        }

        .main-container {
            max-width: 100%;
            margin: 0 auto;
            padding: 0;
            box-sizing: border-box;
        }
        .success-btn:active {
    transform: scale(0.98);
    background: #000000 !important;
    color: #D4AF37 !important;
}
        .logo {
            max-width: 180px; /* Ideal size for desktop */
            height: auto;
            margin: 0 auto 2rem;
            display: block;
            transition: transform 0.3s ease;
            /* Gold accent effect to match theme */
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.3));
        }

        @media (max-width: 768px) {
            .logo {
                max-width: 140px; /* Slightly smaller for mobile */
                margin-bottom: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .logo {
                max-width: 120px;
            }
        }

        /* Optional hover effect */
        .logo:hover {
            transform: scale(1.05);
        }
        @media (max-width: 768px) {
            .success-card {
                padding: 2rem 1.5rem;
            }
            
            .success-card h1 {
                font-size: 2rem;
            }
            
            .success-text {
                font-size: 1rem;
            }
            
            .success-btn {
        width: 100%; /* Full width on mobile */
        padding: 1rem 1.5rem; /* Increase tap target size */
        font-size: 1rem;
        display: block; /* Make it a block element */
        margin: 0 auto; /* Center if not full-width */
    }

    /* Prevent text wrapping */
    .success-btn span {
        white-space: nowrap;
        display: inline-block;
    }
        }
    </style>
</head>
<body>
    <div class="main-container">
    <div class="success-wrapper">
        <div class="success-content">
            <div class="success-card">
                <a href="index.html"><img class="logo" src="images/logo.png" ></img></a>
                <h1>Message Received</h1>
                <p class="success-text">
                    Thank you for your submission. Your message has been successfully delivered.<br>
                    I will respond to your inquiry within 24-48 hours.
                </p>
                <a href="contact.html" class="success-btn"><span>Return to Contact</span></a>
                <p class="additional-options">
                    or go back to <a href="index.html">Homepage</a>
                </p>
            </div>
        </div>
    </div>
</div>

    <!-- Footer (Add your existing footer here if needed) -->

    <script>
        // Add subtle animation
        document.addEventListener('DOMContentLoaded', function() {
            const elements = document.querySelectorAll('.success-icon, .success-card h1, .success-text');
            elements.forEach((el, index) => {
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 100 * index);
            });
        });
    </script>
</body>
</html>
