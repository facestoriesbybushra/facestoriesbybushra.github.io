<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portfolio - Face Stories by Bushra</title>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #FFD700;
            --black: #000000;
            --dark-bg: #000000;
            --text-white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-white);
            overflow-x: hidden;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(26, 26, 26, 0.98);
            z-index: 1000;
            padding: 1rem 0;
            border-bottom: 2px solid var(--gold);
            backdrop-filter: blur(8px);
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            list-style: none;
            padding: 0 1rem;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: var(--text-white);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
            white-space: nowrap;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        .gallery-container {
            padding: 90px 1rem 100px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            transition: transform 0.3s ease;
            aspect-ratio: 3/4;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 2px solid transparent;
            transition: border-color 0.3s ease;
        }

        .gallery-item:hover {
            transform: scale(1.02);
        }

        .gallery-item:hover img {
            border-color: var(--gold);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
        }

        .modal-content {
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-image {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-image.active {
            opacity: 1;
        }

        .modal-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            color: var(--gold);
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 2100;
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 1rem;
            z-index: 2100;
        }

        .nav-btn {
            background: rgba(26, 26, 26, 0.8);
            border: 2px solid var(--gold);
            color: var(--gold);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: var(--gold);
            color: var(--black);
        }

        .site-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--black);
            border-top: 2px solid var(--gold);
            padding: 1rem;
            z-index: 1000;
            text-align: center;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        .social-links a {
            color: var(--text-white);
            font-size: 1.4rem;
            transition: color 0.3s ease;
        }

        .social-links a:hover {
            color: var(--gold);
        }

        @media (max-width: 768px) {
            .gallery-container {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                padding: 80px 0.5rem 90px;
                gap: 0.5rem;
            }

            .gallery-item {
                aspect-ratio: 2/3;
            }

            .modal-close {
                top: 1rem;
                right: 1rem;
                font-size: 1.5rem;
            }

            .nav-btn {
                width: 35px;
                height: 35px;
                font-size: 0.9rem;
            }

            .nav-links {
                gap: 1rem;
            }
        }

        @media (max-width: 480px) {
            .gallery-container {
                grid-template-columns: 1fr;
                padding: 80px 0.5rem 90px;
            }

            .gallery-item {
                aspect-ratio: 3/4;
                max-width: 100%;
                margin: 0 auto;
            }

            .nav-links a {
                font-size: 0.85rem;
            }

            .social-links a {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

    <script>
        const galleryItems = document.querySelectorAll('.gallery-item');
        const modal = document.querySelector('.modal');
        const modalImage = document.querySelector('.modal-image');
        const closeModal = document.querySelector('.modal-close');
        const prevBtn = document.querySelector('.prev-btn');
        const nextBtn = document.querySelector('.next-btn');
        const images = Array.from(galleryItems).map(item => item.querySelector('img').src);
        let currentIndex = 0;

        function openModal(index) {
            currentIndex = index;
            modal.style.display = 'block';
            modalImage.src = images[currentIndex];
            setTimeout(() => modalImage.classList.add('active'), 50);
        }

        function navigate(direction) {
            currentIndex = (currentIndex + direction + images.length) % images.length;
            modalImage.classList.remove('active');
            setTimeout(() => {
                modalImage.src = images[currentIndex];
                modalImage.classList.add('active');
            }, 300);
        }

        galleryItems.forEach((item, index) => item.addEventListener('click', () => openModal(index)));
        closeModal.addEventListener('click', () => modal.style.display = 'none');
        prevBtn.addEventListener('click', () => navigate(-1));
        nextBtn.addEventListener('click', () => navigate(1));

        let touchStartX = 0;
        modal.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX);
        modal.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].clientX;
            if (Math.abs(touchStartX - touchEndX) > 50) {
                touchStartX > touchEndX ? navigate(1) : navigate(-1);
            }
        });

        modal.addEventListener('click', e => {
            if (e.target === modal) modal.style.display = 'none';
        });

        document.addEventListener('keydown', e => {
            if (modal.style.display === 'block') {
                if (e.key === 'ArrowLeft') navigate(-1);
                if (e.key === 'ArrowRight') navigate(1);
                if (e.key === 'Escape') modal.style.display = 'none';
            }
        });
    </script>
