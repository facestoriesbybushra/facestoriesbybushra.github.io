    <!--
      Google Analytics only. The Meta Pixel is deliberately left off this page:
      a 404 hit is not an audience worth retargeting, and counting it as a
      PageView would skew ad optimisation. The GA4 event below records which
      broken URL was requested, so dead links can be found and fixed.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y875RYH6HM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-Y875RYH6HM');
      gtag('event', 'page_not_found', {
        requested_path: window.location.pathname,
        referrer: document.referrer
      });
    </script>
</head>

<body>

                or go back to the <a href="/">Homepage</a>
            </p>

    </main>
